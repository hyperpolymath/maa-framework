# This workflow is managed by gh actions-lock.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Build, test, lint (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Ensure clippy and rustfmt are present
        run: rustup component add clippy rustfmt

      - name: Build (offline, zero dependencies)
        run: cargo build --offline

      - name: Test
        run: cargo test --offline

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (warnings denied)
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Enforce zero dependencies
        run: |
          if cargo tree --offline --depth 1 | tail -n +2 | grep -q '[a-z]'; then
            echo "ERROR: dependencies detected — this crate must stay zero-dependency."
            cargo tree --offline --depth 1
            exit 1
          fi
          echo "OK: zero dependencies"
