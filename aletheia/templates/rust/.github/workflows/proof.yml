# SPDX-License-Identifier: MPL-2.0
# Creusot proof gate. Separate from ci.yml on purpose: the offline Bronze job
# must stay fast and dependency-free, while proving needs a pinned nightly
# plus Creusot's forks of Why3 and why3find.
#
# This is a real gate — `cargo creusot` exits non-zero when any obligation is
# unproved. It is deliberately *not* part of `just check`.
#
# It has not yet run on a GitHub runner: treat the first green run as the
# moment it becomes load-bearing. It is not blind, though — every step below
# was executed by hand against a from-scratch toolchain, and three defects it
# used to have (a bad rust-toolchain parse, a stale hard-coded Why3 pin, and a
# setup that could never find creusot-rustc) were found that way.
name: Proof (Creusot)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'verification/**'
      - 'Cargo.toml'
      - 'Justfile'
      - '.github/workflows/proof.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'verification/**'
      - 'Cargo.toml'
      - 'Justfile'
      - '.github/workflows/proof.yml'
  workflow_dispatch:

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  # Pinned rather than tracking master. A proof gate that changes its toolchain
  # underneath a passing build is not a gate; bump this deliberately, with a
  # proof run to go with it. The Why3/why3find forks are *derived* from this
  # revision's creusot-deps.opam below — hard-coding them here is how the
  # previous version of this file went stale.
  CREUSOT_REV: de6f4acdaeabf8d81784676f848f99c0c1db1851

jobs:
  creusot:
    name: Translate and discharge (Creusot + Why3)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Pinned to a full SHA rather than relying on actions.lock: only two of
      # the six templates ship this opt-in workflow, and a lock entry for a
      # file the other four do not have would be noise in a shared file.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No z3/cvc5 here: the `provers` installer component fetches the exact
      # versions Creusot's why3.conf names in its drivers (alt-ergo 2.6.2,
      # z3 4.15.3, cvc4 1.8, cvc5 1.3.1). An apt z3 is a different version
      # behind the same driver name, which is a silent way to get different
      # results from the same proof.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            opam ocaml build-essential pkg-config libgmp-dev zlib1g-dev autoconf curl

      - name: Clone Creusot at the pinned revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/creusot"
          cd "$RUNNER_TEMP/creusot"
          git init -q
          git remote add origin https://github.com/creusot-rs/creusot
          git fetch -q --depth 1 origin "$CREUSOT_REV"
          git checkout -q FETCH_HEAD
          echo "creusot at $(git rev-parse HEAD)"

      # Creusot pins its own nightly; read it from the clone rather than
      # duplicating a second copy that can drift.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          # Creusot pins the channel in a `rust-toolchain` file: TOML, but
          # without the .toml extension. The obvious `head -1` yields
          # "[toolchain]" and installs the wrong toolchain entirely.
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' \
            "$RUNNER_TEMP/creusot/rust-toolchain")
          if [ -z "$channel" ]; then
            echo "::error::could not read the channel from creusot's rust-toolchain file"
            exit 1
          fi
          echo "Creusot pins $channel"
          rustup toolchain install "$channel" --component rustc-dev,llvm-tools
          rustup default "$channel"

      - name: Install Why3 and why3find (Creusot's forks)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/creusot"
          # Derive the forks from the revision we checked out. A stock Why3
          # cannot parse the Coma a given Creusot emits, and a stock why3find
          # does not compile against the pinned Why3.
          WHY3_PIN=$(grep -oE 'git\+https://gitlab\.inria\.fr/why3/why3\.git#[0-9a-f]{40}' creusot-deps.opam | head -1)
          WHY3FIND_PIN=$(grep -oE 'git\+https://github\.com/creusot-rs/why3find\.git#[0-9a-f]{40}' creusot-deps.opam | head -1)
          if [ -z "$WHY3_PIN" ] || [ -z "$WHY3FIND_PIN" ]; then
            echo "::error::could not read the why3/why3find pins from creusot-deps.opam"
            exit 1
          fi
          echo "why3      -> $WHY3_PIN"
          echo "why3find  -> $WHY3FIND_PIN"
          opam init --bare --disable-sandboxing -y
          opam switch create creusot ocaml-system -y
          eval "$(opam env --switch=creusot --set-switch)"
          opam pin add -y why3 "$WHY3_PIN"
          opam install -y why3
          opam pin add -y why3find "$WHY3FIND_PIN"
          opam install -y why3find
          why3 --version
          why3find --version
          opam env --switch=creusot --set-switch >> "$GITHUB_ENV"

      # `cargo creusot` does not look for its tools on PATH. It resolves them
      # inside its own data dir ($XDG_DATA_HOME/creusot):
      #   bin/why3, bin/why3find, bin/<prover>   (why3_launcher.rs puts bin first on PATH)
      #   toolchains/<channel>/bin/creusot-rustc
      #   share/why3find/packages/creusot        (the prelude)
      # Installing the two binaries by hand and stopping there is not enough:
      # proving then dies with "creusot-rustc not found (expected at ...)".
      # This one call lays out the prelude, the why3 config, the four provers,
      # the toolchain-local creusot-rustc, and the cargo config patch for the
      # creusot-std path dependency.
      - name: Install Creusot (prelude, provers, toolchain, cargo config)
        working-directory: ${{ runner.temp }}/creusot
        run: |
          set -euo pipefail
          eval "$(opam env --switch=creusot --set-switch)"
          cargo run --quiet --release --bin creusot-install -- \
            prelude why3-conf provers creusot-rustc cargo-creusot cargo-creusot-config

      # The installer also has a `why3` component that provides these two, but
      # it builds a second opam switch from creusot-deps.opam inside the data
      # dir, which drags in the GTK-based why3 IDE. The component's last act is
      # to symlink these two binaries into the data dir (see
      # creusot-install/src/main.rs), so do the same from the switch we already
      # have — same end state, no GTK, no second switch.
      - name: Provide why3 and why3find in the Creusot data dir
        run: |
          set -euo pipefail
          eval "$(opam env --switch=creusot --set-switch)"
          data_dir="$HOME/.local/share/creusot"
          mkdir -p "$data_dir/bin"
          ln -sf "$(command -v why3)" "$data_dir/bin/why3"
          ln -sf "$(command -v why3find)" "$data_dir/bin/why3find"
          ls -l "$data_dir/bin"

      # Checks what cargo-creusot actually resolves at runtime, instead of
      # assuming the install worked. A "not found" prover here means the proof
      # step would fail confusingly several minutes later.
      - name: Check the Creusot install
        run: |
          set -euo pipefail
          eval "$(opam env --switch=creusot --set-switch)"
          cargo creusot version
          if cargo creusot version | grep -qi 'not found'; then
            echo "::error::cargo creusot cannot resolve its tools"
            exit 1
          fi

      # Fails the job if any goal is unproved. Mirrors `just proof`, which is
      # exactly this one command in verification/.
      - name: Prove
        working-directory: verification
        run: cargo creusot

      - name: Proof artefacts
        if: always()
        run: find verification/verif -name '*.coma' -o -name 'proof.json' 2>/dev/null | head -50 || true
