# SPDX-License-Identifier: MPL-2.0
# Root Rust CI gate for the aletheia crate.
#
# Restored 2026-09-21: the previous gate was deleted in the commit that
# moved the crate to aletheia/ and never re-pointed, so main has had no
# Rust CI since. This version re-points every step at aletheia/ and adds
# the clippy -D warnings job (the blocking gate half of issue #125).
#
# Action refs are tags resolved by .github/workflows/actions.lock (the
# estate mechanism — governance verifies the lock and forbids inline SHAs
# alongside it). Every job below has a same-named recipe in the root
# Justfile; keep them in lockstep so `just check` means the same thing
# locally as this gate. Toolchain is the runner's ambient Rust (the crate
# declares rust-version 1.80; there is deliberately no pinned toolchain
# action here, to keep the lockfile surface to checkout alone). No
# #![allow(dead_code)] workarounds: dead code here is either wired or
# deleted (see the never-allow-dead-code landmine in STATE.a2ml).
name: rust-ci
on:
  push:
    branches: [main]
    paths:
      - 'aletheia/**'
      - 'Justfile'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'aletheia/**'
      - 'Justfile'
      - '.github/workflows/rust-ci.yml'
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: aletheia
jobs:
  build:
    name: build (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain versions
        run: cargo --version && rustc --version
      - name: Build all targets (debug, locked)
        run: cargo build --locked --all-targets
      - name: Build release (locked)
        run: cargo build --locked --release
  test:
    name: test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Full test suite (locked)
        run: cargo test --locked
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check formatting
        run: cargo fmt --check
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint all targets, warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings
  deps-check:
    name: zero-dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enforce the zero-dependency RSR Bronze constraint
        run: |
          if cargo tree --depth 1 | tail -n +2 | grep -q '[a-z]'; then
            echo "ERROR: Aletheia must have zero dependencies (see aletheia/CLAUDE.md)"
            cargo tree --depth 1
            exit 1
          fi
          echo "OK: zero dependencies"
