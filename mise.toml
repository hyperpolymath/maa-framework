# SPDX-License-Identifier: MPL-2.0
# Toolchain pins for mise (https://mise.jdx.dev). Kept in sync with
# .tool-versions (the asdf-compatible spelling the RSR tool-versions
# check reads). Pins measured 2026-09-21 from the stable channels.
[tools]
# Rust: the only compiled language in tree (aletheia crate, edition 2021,
# MSRV 1.80). Pinned to current stable — what CI's ambient toolchain is.
rust = "1.98.1"

# just is intentionally NOT pinned: any recent just runs these Justfiles.
# Install via cargo (`cargo install just`) or your package manager.
# git is system-provided, not toolchain-managed.
#
# The 30-entry all-"latest" template this replaced installed runtimes the
# estate bans here (node/python/go) and pinned nothing — "latest" is not a
# pin. Task shortcuts live in the Justfile (`just build/test/check/...`),
# not in mise aliases, so the old [alias] command table went with it.
