# This workflow is managed by gh actions-lock.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Build, test, lint (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install GNAT and gprbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat gprbuild

      - name: Build
        run: gprbuild -p -P proofada.gpr

      - name: Test
        run: |
          gprbuild -p -P tests/tests.gpr
          ./obj-tests/run_tests
