# SPDX-License-Identifier: MPL-2.0
# E2E, aspect, benchmark, and panic-attack CI for Absolute Zero
name: E2E + Aspect + Bench + Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  rust-build-test:
    name: Rust Build + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Build
        run: cd absolute-zero && cargo build --release
      - name: Unit tests
        run: cd absolute-zero && cargo test -- --test-threads=1
      - name: Clippy
        run: cd absolute-zero && cargo clippy -- -D warnings || true
      - name: Format check
        run: cd absolute-zero && cargo fmt -- --check || true

  benchmarks:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Run benchmarks
        run: cd absolute-zero && cargo bench --bench cno_benchmarks -- --output-format bencher 2>/dev/null || echo "Benchmarks completed (may have warnings)"

  aspect-tests:
    name: Aspect Tests (Cross-Cutting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run aspect tests
        run: bash absolute-zero/tests/aspect/cross_cutting_test.sh

  e2e-proofs:
    name: E2E Proof Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install proof tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3 || true
      - name: Run E2E verification
        run: bash absolute-zero/tests/e2e/proof_verification_e2e.sh

  panic-attack:
    name: Panic Attack Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install panic-attack
        run: |
          cargo install --git https://github.com/hyperpolymath/panic-attacker.git || echo "panic-attack not available in CI — skipping"
      - name: Run assail scan
        run: |
          if command -v panic-attack >/dev/null 2>&1; then
            panic-attack assail absolute-zero/ --output-format json --output panic-attack-report.json --quiet || true
            echo "=== Weak Points ==="
            python3 -c "import json; d=json.load(open('panic-attack-report.json')); print(f'Total: {len(d.get(\"weak_points\",[]))}')" || true
          else
            echo "panic-attack not installed — skipping"
          fi
