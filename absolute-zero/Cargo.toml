[package]
name = "absolute-zero"
version = "1.0.0"
edition = "2021"
description = "Certified Null Operation - A program that does absolutely nothing"
license = "MPL-2.0"

[workspace]
members = ["src/brainfuck", "src/whitespace"]

[dependencies]
brainfuck-cno = { path = "src/brainfuck" }
whitespace-cno = { path = "src/whitespace" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cno_benchmarks"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
