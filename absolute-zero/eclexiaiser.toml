# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: MPL-2.0

[project]
name = "absolute-zero"

[[functions]]
name = "test_cno"
source = "src/brainfuck/src/main.rs"
energy-budget-mj = 30.0
carbon-budget-mg = 6.0

[[functions]]
name = "annotateAudits"
source = "src/AuditTrail.res"
energy-budget-mj = 10.0
carbon-budget-mg = 2.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
