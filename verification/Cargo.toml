[package]
name = "proofgateway-verification"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Creusot proof obligations for proofgateway"
publish = false

# This crate is deliberately NOT part of the main workspace (see the root
# Cargo.toml `exclude`), so the main crate stays zero-dependency.
#
# `creusot-std` is resolved locally by the Creusot toolchain: `cargo creusot
# config --update` writes a `[patch.crates-io]` entry into your cargo config
# pointing at the installed copy. Nothing is fetched from a git remote here.
[dependencies]
creusot-std = "0.14.0-dev"

# `src/impl.rs` (included below) gates its specifications behind
# `#[cfg(creusot)]`; declare the cfg so the lint stays meaningful.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(creusot)"] }
