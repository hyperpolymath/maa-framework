# SPDX-License-Identifier: MPL-2.0
# SPARK proof gate. Separate from ci.yml on purpose: the offline Bronze job
# must stay fast and dependency-free, while proving needs gnatprove.
#
# This workflow is a real gate — `gnatprove` runs with --checks-as-errors (set
# in the project's Prove package), so an unproved check fails the job instead
# of exiting 0. It is deliberately *not* part of `just check`.
name: Proof (SPARK)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.gpr'
      - 'Justfile'
      - '.github/workflows/proof.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.gpr'
      - 'Justfile'
      - '.github/workflows/proof.yml'
  workflow_dispatch:

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  spark:
    name: Prove SPARK units (gnatprove)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned to a full SHA rather than relying on actions.lock: only two of
      # the six templates ship this opt-in workflow, and a lock entry for a
      # file the other four do not have would be noise in a shared file.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gnatprove ships its own Why3 and versions of Alt-Ergo/CVC5, so there is
      # nothing else to install and no solver version to drift. Pinned by URL
      # and checksum: this artefact is a release asset, not a mutable tag.
      - name: Install gnatprove 13.2.0
        run: |
          set -euo pipefail
          url="https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-13.2.0-1/gnatprove-x86_64-linux-13.2.0-1.tar.gz"
          curl -fsSL -o /tmp/gnatprove.tar.gz "$url"
          echo "28fc3583d2364c1e10790fe258c408faffa42d7ff77bb81dc18d4907608f4017  /tmp/gnatprove.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/gnatprove
          sudo tar xzf /tmp/gnatprove.tar.gz -C /opt/gnatprove --strip-components=1
          echo "/opt/gnatprove/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          gnatprove --version
          gprbuild --version | head -1

      # The GPR's Prove package carries --level=2 and --checks-as-errors, so
      # this fails on any unproved check. `just proof` runs the same command.
      - name: Prove
        run: |
          gprbuild -p -P @@MOD_NAME@@.gpr
          gnatprove -P @@MOD_NAME@@.gpr

      - name: Proof summary
        if: always()
        run: |
          if [ -f obj/gnatprove/gnatprove.out ]; then
            tail -25 obj/gnatprove/gnatprove.out
          else
            echo "no proof summary produced"
          fi
